Configuration:
  status: warn

  Appenders:
    Console:
      name: CONSOLE
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %50.50logger{50} - %notEmpty{[%X{traceId}] : }%replace{%replace{%msg %ex}{\"correlation\":\"[^\"]*\",}{}}{[\r\n]+}{ }%n"

  Loggers:
    Logger:
    AsyncLogger:
      - name: org.zalando.logbook
        level: TRACE
        additivity: false
        includeLocation: false
        AppenderRef:
          ref: CONSOLE
      - name: site.ng_archive
        level: INFO
        additivity: false
        includeLocation: false
        AppenderRef:
          ref: CONSOLE
      - name: site.ng_archive.ecom_common.logging
        level: TRACE
        additivity: false
        includeLocation: false
        AppenderRef:
          ref: CONSOLE
    AsyncRoot:
      level: INFO
      includeLocation: false
      AppenderRef:
        ref: CONSOLE